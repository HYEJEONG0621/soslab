[build]
  publish = "."
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "18"
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200
[[redirects]]
  from = "/api/ai"
  to   = "/.netlify/functions/ai"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
